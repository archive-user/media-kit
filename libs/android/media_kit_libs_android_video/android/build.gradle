import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://github.com/archive-user/libmpv-android-video-build/releases/download/1.0.3/default-arm64-v8a.jar", "sha256": "sha256:bd01db8621d36f8d16e975da11fc886d33b3192c8fd4b011e87545336eda50f7", "destination": file("$buildDir/1.0.3/default-arm64-v8a.jar")],
            ["url": "https://github.com/archive-user/libmpv-android-video-build/releases/download/1.0.3/default-armeabi-v7a.jar", "sha256": "sha256:9f9285431181da2947e274ff6b6f0a8668dedcfcb23c59b0218b666592833201", "destination": file("$buildDir/1.0.3/default-armeabi-v7a.jar")],
            ["url": "https://github.com/archive-user/libmpv-android-video-build/releases/download/1.0.3/default-x86_64.jar", "sha256": "sha256:7b6a3dc2fae59c1808a107a5bc3ff6f2f3c6fea1de6b15cfd6216b983bde3f96", "destination": file("$buildDir/1.0.3/default-x86_64.jar")],
            ["url": "https://github.com/archive-user/libmpv-android-video-build/releases/download/1.0.3/default-x86.jar", "sha256": "sha256:7a62ceda9c60da4ad43faccd6c10303bded8e3b50835e82ae158c8a1bb977bf7", "destination": file("$buildDir/1.0.3/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)